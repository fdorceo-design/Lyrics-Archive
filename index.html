<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics Archive</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #222;
    --bg: #fff;
    --sub: #666;
    --line: #ddd;
    --link: #0645ad;
    --tag-bg: #eee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ddd;
      --bg: #1a1a1a;
      --sub: #999;
      --line: #333;
      --link: #7aa2f7;
      --tag-bg: #2a2a2a;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
    line-height: 1.7;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.2rem;
  }
  p.desc {
    color: var(--sub);
    font-size: 0.9rem;
    margin-top: 0;
  }
  .controls {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-top: 1rem;
  }
  .controls select, .controls input {
    font-size: 0.85rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
  }
  .count {
    color: var(--sub);
    font-size: 0.8rem;
    margin-top: 0.5rem;
  }
  ul.song-list {
    list-style: none;
    margin: 1.5rem 0 0;
    padding: 0;
  }
  li.song {
    border-top: 1px solid var(--line);
    padding: 0.9rem 0;
  }
  li.song:last-child {
    border-bottom: 1px solid var(--line);
  }
  .song-date {
    color: var(--sub);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .song-title {
    font-size: 1.05rem;
    margin: 0.15rem 0;
  }
  .song-title a {
    color: var(--link);
    text-decoration: none;
  }
  .song-title a:hover {
    text-decoration: underline;
  }
  .song-tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--sub);
    background: var(--tag-bg);
    border-radius: 3px;
    padding: 0.1rem 0.45rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
  .song-vocal {
    color: var(--sub);
    font-size: 0.85rem;
  }
  .song-note {
    color: var(--sub);
    font-size: 0.8rem;
    margin-top: 0.2rem;
  }
  .song-lyrics {
    margin-top: 0.5rem;
    white-space: pre-wrap;
    font-size: 0.9rem;
    border-left: 2px solid var(--line);
    padding-left: 0.8rem;
  }
</style>
</head>
<body>

<h1>Lyrics Archive</h1>
<p class="desc">Fドアの投稿アーカイブ。ニコニコ動画への投稿日時を発表日として、古い順に並べています。</p>

<div class="controls">
  <label>タグ: <select id="filterTag"><option value="">すべて</option></select></label>
  <label>年: <select id="filterYear"><option value="">すべて</option></select></label>
  <input id="filterText" type="text" placeholder="タイトル検索..." />
</div>
<p class="count" id="count"></p>

<ul class="song-list" id="song-list"></ul>

<script>
let SONGS = [];

function populateFilters() {
  const tagSel = document.getElementById('filterTag');
  const yearSel = document.getElementById('filterYear');
  const tags = [...new Set(SONGS.map(s => s.tag).filter(Boolean))].sort();
  tags.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    tagSel.appendChild(o);
  });
  const years = [...new Set(SONGS.map(s => s.date.slice(0,4)))].sort().reverse();
  years.forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '年';
    yearSel.appendChild(o);
  });
}

async function renderList() {
  const tagF = document.getElementById('filterTag').value;
  const yearF = document.getElementById('filterYear').value;
  const textF = document.getElementById('filterText').value.trim().toLowerCase();

  const filtered = SONGS.filter(s => {
    if (tagF && s.tag !== tagF) return false;
    if (yearF && s.date.slice(0,4) !== yearF) return false;
    if (textF && !s.title.toLowerCase().includes(textF)) return false;
    return true;
  });

  document.getElementById('count').textContent = filtered.length + ' 件 / 全' + SONGS.length + '件';

  const list = document.getElementById('song-list');
  list.innerHTML = '';

  for (const song of filtered) {
    const li = document.createElement('li');
    li.className = 'song';

    const date = document.createElement('div');
    date.className = 'song-date';
    date.textContent = song.date;
    li.appendChild(date);

    const title = document.createElement('div');
    title.className = 'song-title';
    const a = document.createElement('a');
    a.href = song.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = song.title;
    title.appendChild(a);
    if (song.tag) {
      const tag = document.createElement('span');
      tag.className = 'song-tag';
      tag.textContent = song.tag;
      title.appendChild(tag);
    }
    li.appendChild(title);

    if (song.vocal) {
      const vocal = document.createElement('div');
      vocal.className = 'song-vocal';
      vocal.textContent = 'Vocal: ' + song.vocal;
      li.appendChild(vocal);
    }

    if (song.note) {
      const note = document.createElement('div');
      note.className = 'song-note';
      note.textContent = song.note;
      li.appendChild(note);
    }

    if (song.lyrics) {
      try {
        const lyricsRes = await fetch('lyrics/' + song.lyrics);
        if (lyricsRes.ok) {
          const text = await lyricsRes.text();
          const lyrics = document.createElement('div');
          lyrics.className = 'song-lyrics';
          lyrics.textContent = text;
          li.appendChild(lyrics);
        }
      } catch (e) {
        // 歌詞ファイルが読めなければ無視
      }
    }

    list.appendChild(li);
  }
}

async function init() {
  const res = await fetch('songs.json');
  SONGS = await res.json();
  SONGS.sort((a, b) => a.date.localeCompare(b.date));
  populateFilters();
  document.getElementById('filterTag').addEventListener('change', renderList);
  document.getElementById('filterYear').addEventListener('change', renderList);
  document.getElementById('filterText').addEventListener('input', renderList);
  renderList();
}

init();
</script>

</body>
</html>
