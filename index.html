<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics Archive</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #222;
    --bg: #fff;
    --panel-bg: #fafafa;
    --sub: #666;
    --line: #ddd;
    --link: #0645ad;
    --tag-bg: #eee;
    --ok: #2a7a3d;
    --missing: #b33;
    --selected: #e8f0fe;
    --warn: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #ddd;
      --bg: #1a1a1a;
      --panel-bg: #202020;
      --sub: #999;
      --line: #333;
      --link: #7aa2f7;
      --tag-bg: #2a2a2a;
      --ok: #6fcf87;
      --missing: #e88;
      --selected: #23324a;
      --warn: #d4a72c;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }
  header {
    padding: 0.8rem 1rem 0.6rem;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .controls select, .controls input {
    font-size: 0.82rem; padding: 0.3rem 0.5rem; border: 1px solid var(--line);
    border-radius: 4px; background: var(--bg); color: var(--fg);
  }
  .count { color: var(--sub); font-size: 0.78rem; margin-left: auto; }
  .tag-chips { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
  .tag-chip {
    font-size: 0.78rem; padding: 0.25rem 0.6rem; border: 1px solid var(--line);
    border-radius: 999px; background: var(--bg); color: var(--fg); cursor: pointer;
    user-select: none;
  }
  .tag-chip:hover { background: var(--panel-bg); }
  .tag-chip.active { background: var(--selected); border-color: var(--link); color: var(--link); }

  .main { flex: 1; display: flex; min-height: 0; }
  .list-pane {
    width: 40%; min-width: 280px; max-width: 480px;
    overflow-y: auto; border-right: 1px solid var(--line);
  }
  .detail-pane { flex: 1; overflow-y: auto; padding: 1.2rem 1.5rem; }

  .work-row {
    padding: 0.55rem 0.9rem; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .work-row:hover { background: var(--panel-bg); }
  .work-row.selected { background: var(--selected); }
  .work-title { font-size: 0.92rem; margin-bottom: 0.15rem; }
  .work-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; font-size: 0.72rem; color: var(--sub); }
  .badge { background: var(--tag-bg); border-radius: 3px; padding: 0.05rem 0.4rem; }
  .badge.ok { color: var(--ok); }
  .badge.missing { color: var(--missing); }
  .badge.warn { color: var(--warn); }

  .detail-title { font-size: 1.3rem; margin: 0 0 0.3rem; }
  .detail-year { color: var(--sub); font-size: 0.85rem; margin-bottom: 1rem; }
  .section { margin-bottom: 1.4rem; }
  .section h2 { font-size: 0.85rem; color: var(--sub); margin: 0 0 0.4rem; font-weight: 600; }
  .credit-row { font-size: 0.9rem; margin-bottom: 0.15rem; }
  .credit-row .label { color: var(--sub); display: inline-block; width: 4.5em; }
  .release-row { font-size: 0.88rem; margin-bottom: 0.3rem; display: flex; gap: 0.5rem; align-items: baseline; }
  .release-platform { color: var(--sub); min-width: 5.5em; flex-shrink: 0; font-size: 0.78rem; white-space: nowrap; }
  .release-row a { color: var(--link); text-decoration: none; }
  .release-row a:hover { text-decoration: underline; }
  .release-missing { color: var(--sub); font-style: italic; font-size: 0.85rem; }
  .lyrics-box {
    white-space: pre-wrap; font-size: 0.92rem; line-height: 1.8;
    border-left: 2px solid var(--line); padding-left: 0.9rem;
  }
  .empty-note { color: var(--sub); font-size: 0.85rem; font-style: italic; }
  .placeholder { color: var(--sub); padding: 2rem; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Lyrics Archive</h1>
  <div class="controls">
    <div class="tag-chips" id="tagChips"></div>
    <select id="filterYear"><option value="">年: すべて</option></select>
    <input id="filterText" type="text" placeholder="タイトル検索..." />
    <span class="count" id="count"></span>
  </div>
  <div class="controls" id="quickFilters"></div>
</header>

<div class="main">
  <div class="list-pane" id="listPane"></div>
  <div class="detail-pane" id="detailPane">
    <div class="placeholder">左のリストから作品を選んでください</div>
  </div>
</div>

<script>
let POSTS = [];
let POSTS_BY_ID = new Map();
let DETAILS_CACHE = new Map();
let selectedId = null;
let activeTags = new Set();
let shortsOnly = false;
let noLyricsOnly = false;

const PLATFORM_LABEL = { youtube: 'YouTube', piapro: 'ピアプロ', note: 'note' };

function renderTagChips() {
  const wrap = document.getElementById('tagChips');
  wrap.innerHTML = '';
  const tags = [...new Set(POSTS.map(p => p.type).filter(Boolean))].sort();
  for (const t of tags) {
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (activeTags.has(t) ? ' active' : '');
    chip.textContent = t;
    chip.addEventListener('click', () => {
      if (activeTags.has(t)) activeTags.delete(t);
      else activeTags.add(t);
      shortsOnly = false;
      noLyricsOnly = false;
      renderTagChips();
      renderQuickFilters();
      renderList();
    });
    wrap.appendChild(chip);
  }
}

function renderQuickFilters() {
  const wrap = document.getElementById('quickFilters');
  wrap.innerHTML = '';
  const allTags = [...new Set(POSTS.map(p => p.type).filter(Boolean))];
  const typeButtons = ['オリジナル', 'セルフカバー', 'カバー', '別版'].filter(t => allTags.includes(t));
  for (const t of typeButtons) {
    const btn = document.createElement('span');
    btn.className = 'tag-chip';
    btn.textContent = t + 'のみ';
    btn.addEventListener('click', () => {
      activeTags = new Set([t]);
      shortsOnly = false;
      noLyricsOnly = false;
      renderTagChips();
      renderQuickFilters();
      renderList();
    });
    wrap.appendChild(btn);
  }
  const shortsBtn = document.createElement('span');
  shortsBtn.className = 'tag-chip' + (shortsOnly ? ' active' : '');
  shortsBtn.textContent = 'ショートのみ';
  shortsBtn.addEventListener('click', () => {
    shortsOnly = !shortsOnly;
    noLyricsOnly = false;
    if (shortsOnly) activeTags = new Set([...new Set(POSTS.map(p => p.type).filter(Boolean))]);
    renderTagChips();
    renderQuickFilters();
    renderList();
  });
  wrap.appendChild(shortsBtn);

  const noLyricsBtn = document.createElement('span');
  noLyricsBtn.className = 'tag-chip' + (noLyricsOnly ? ' active' : '');
  noLyricsBtn.textContent = 'オリジナル歌詞なし';
  noLyricsBtn.addEventListener('click', () => {
    noLyricsOnly = !noLyricsOnly;
    if (noLyricsOnly) {
      activeTags = new Set(['オリジナル']);
      shortsOnly = false;
    }
    renderTagChips();
    renderQuickFilters();
    renderList();
  });
  wrap.appendChild(noLyricsBtn);
}

function populateFilters() {
  const tags = [...new Set(POSTS.map(p => p.type).filter(Boolean))];
  activeTags = new Set(tags);
  renderTagChips();
  renderQuickFilters();
  const yearSel = document.getElementById('filterYear');
  const years = [...new Set(POSTS.map(p => p.date.slice(0,4)))].sort((a,b) => b - a);
  years.forEach(y => {
    const o = document.createElement('option'); o.value = y; o.textContent = y + '年';
    yearSel.appendChild(o);
  });
}

function hasPlatform(post, platform) {
  if (platform === 'youtube') return Boolean(post.hasYouTube);
  return false;
}

function isShort(post) {
  return post.id.startsWith('ss');
}

function renderList() {
  const yearF = document.getElementById('filterYear').value;
  const textF = document.getElementById('filterText').value.trim().toLowerCase();

  const filtered = POSTS.filter(p => {
    if (!activeTags.has(p.type)) return false;
    if (shortsOnly && !isShort(p)) return false;
    if (noLyricsOnly && p.hasLyrics) return false;
    if (yearF && p.date.slice(0,4) !== yearF) return false;
    if (textF && !p.title.toLowerCase().includes(textF)) return false;
    return true;
  });

  document.getElementById('count').textContent = filtered.length + ' / ' + POSTS.length + ' 件';

  const pane = document.getElementById('listPane');
  pane.innerHTML = '';
  for (const p of filtered) {
    const row = document.createElement('div');
    row.className = 'work-row' + (p.id === selectedId ? ' selected' : '');
    row.dataset.id = p.id;

    const title = document.createElement('div');
    title.className = 'work-title';
    title.textContent = p.title;
    row.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'work-meta';

    const typeBadge = document.createElement('span');
    typeBadge.className = 'badge';
    typeBadge.textContent = p.type;
    meta.appendChild(typeBadge);

    const yearBadge = document.createElement('span');
    yearBadge.textContent = p.date.slice(0,4) + '年';
    meta.appendChild(yearBadge);

    const yt = document.createElement('span');
    yt.className = 'badge ' + (hasPlatform(p, 'youtube') ? 'ok' : 'missing');
    yt.textContent = hasPlatform(p, 'youtube') ? 'YT済' : 'YT未';
    meta.appendChild(yt);

    if (isShort(p)) {
      const sh = document.createElement('span');
      sh.className = 'badge';
      sh.textContent = 'ショート';
      meta.appendChild(sh);
    }

    if (p.deviceRestricted) {
      const dr = document.createElement('span');
      dr.className = 'badge warn';
      dr.textContent = 'デバイス制限';
      meta.appendChild(dr);
    }

    row.appendChild(meta);
    row.addEventListener('click', () => { selectedId = p.id; renderList(); renderDetail(p); });
    pane.appendChild(row);
  }
}

function selectPost(id) {
  const p = POSTS_BY_ID.get(id);
  if (!p) return;
  selectedId = id;
  renderList();
  renderDetail(p);
  document.getElementById('detailPane').scrollTop = 0;
  const row = document.querySelector('.work-row.selected');
  if (row) row.scrollIntoView({ block: 'nearest' });
}

async function loadDetails(id) {
  if (DETAILS_CACHE.has(id)) return DETAILS_CACHE.get(id);
  const res = await fetch('details/' + encodeURIComponent(id) + '.json');
  if (!res.ok) throw new Error('詳細データを読み込めませんでした');
  const detail = await res.json();
  DETAILS_CACHE.set(id, detail);
  return detail;
}

async function loadLyrics(path) {
  const url = path.split('/').map(encodeURIComponent).join('/');
  const res = await fetch(url);
  if (!res.ok) throw new Error('歌詞を読み込めませんでした');
  return res.text();
}

async function renderDetail(p) {
  const pane = document.getElementById('detailPane');
  pane.innerHTML = '<div class="empty-note">読み込み中…</div>';

  let detail;
  try {
    detail = await loadDetails(p.id);
  } catch (error) {
    if (selectedId === p.id) {
      pane.innerHTML = '<div class="empty-note">' + error.message + '</div>';
    }
    return;
  }
  if (selectedId !== p.id) return;
  pane.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'detail-title';
  title.textContent = p.title;
  pane.appendChild(title);

  const year = document.createElement('div');
  year.className = 'detail-year';
  const dp = p.date.split('-');
  const dateLabel = dp.length === 3 ? (dp[0] + '年' + parseInt(dp[1],10) + '月' + parseInt(dp[2],10) + '日') : p.date;
  year.textContent = dateLabel + ' ・ ' + p.type + (isShort(p) ? ' ・ ショート' : '');
  pane.appendChild(year);

  // credits
  const creditsSec = document.createElement('div');
  creditsSec.className = 'section';
  const ch = document.createElement('h2'); ch.textContent = 'クレジット'; creditsSec.appendChild(ch);
  const labels = { lyrics: '作詞', music: '作曲', arrangement: '編曲' };
  let hasCredit = false;
  for (const k of ['lyrics','music','arrangement']) {
    if (detail.credits && detail.credits[k]) {
      hasCredit = true;
      const r = document.createElement('div'); r.className = 'credit-row';
      r.innerHTML = '<span class="label">' + labels[k] + '</span>' + detail.credits[k];
      creditsSec.appendChild(r);
    }
  }
  if (!hasCredit) {
    const n = document.createElement('div'); n.className = 'empty-note'; n.textContent = '未入力';
    creditsSec.appendChild(n);
  }
  pane.appendChild(creditsSec);

  // posting / links
  const relSec = document.createElement('div');
  relSec.className = 'section';
  const rh = document.createElement('h2'); rh.textContent = '投稿・掲載先'; relSec.appendChild(rh);

  const nicoRow = document.createElement('div'); nicoRow.className = 'release-row';
  const nicoPlatform = document.createElement('span');
  nicoPlatform.className = 'release-platform';
  nicoPlatform.textContent = 'ニコニコ';
  nicoRow.appendChild(nicoPlatform);
  const nicoA = document.createElement('a');
  nicoA.href = p.url; nicoA.target = '_blank'; nicoA.rel = 'noopener noreferrer';
  nicoA.textContent = p.title;
  nicoRow.appendChild(nicoA);
  const nicoId = document.createElement('span');
  nicoId.style.color = 'var(--sub)'; nicoId.style.fontSize = '0.78rem';
  nicoId.textContent = ' (' + p.id + ')';
  nicoRow.appendChild(nicoId);
  if (p.deviceRestricted) {
    const dr = document.createElement('span');
    dr.className = 'badge warn';
    dr.style.fontSize = '0.72rem';
    dr.textContent = 'デバイス制限';
    nicoRow.appendChild(dr);
  }
  relSec.appendChild(nicoRow);

  const ytRow = document.createElement('div'); ytRow.className = 'release-row';
  const ytPlatform = document.createElement('span');
  ytPlatform.className = 'release-platform';
  ytPlatform.textContent = 'YouTube';
  ytRow.appendChild(ytPlatform);
  const ytLink = detail.externalLinks.find(x => x.platform === 'youtube');
  if (ytLink && (ytLink.id || ytLink.url)) {
    const a = document.createElement('a');
    a.href = ytLink.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = ytLink.versionLabel || ytLink.url;
    ytRow.appendChild(a);
  } else {
    const m = document.createElement('span');
    m.className = 'release-missing';
    m.textContent = '未掲載';
    ytRow.appendChild(m);
  }
  relSec.appendChild(ytRow);
  pane.appendChild(relSec);

  // related songs (cross-linked)
  if (detail.relatedIds && detail.relatedIds.length) {
    const relatedSec = document.createElement('div');
    relatedSec.className = 'section';
    const relh = document.createElement('h2'); relh.textContent = '関連曲'; relatedSec.appendChild(relh);
    for (const rid of detail.relatedIds) {
      const rp = POSTS_BY_ID.get(rid);
      if (!rp) continue;
      const row = document.createElement('div'); row.className = 'release-row';
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = rp.title;
      a.addEventListener('click', (e) => { e.preventDefault(); selectPost(rid); });
      row.appendChild(a);
      const d = document.createElement('span');
      d.style.color = 'var(--sub)'; d.style.fontSize = '0.78rem';
      d.textContent = ' (' + rp.date + ' / ' + rp.type + ')';
      row.appendChild(d);
      relatedSec.appendChild(row);
    }
    pane.appendChild(relatedSec);
  }

  // other info
  const otherSec = document.createElement('div');
  otherSec.className = 'section';
  const oh = document.createElement('h2'); oh.textContent = 'その他情報'; otherSec.appendChild(oh);

  for (const platform of ['piapro','note']) {
    const r = detail.externalLinks.find(x => x.platform === platform);
    const row = document.createElement('div'); row.className = 'release-row';
    const plat = document.createElement('span');
    plat.className = 'release-platform';
    plat.textContent = PLATFORM_LABEL[platform];
    row.appendChild(plat);
    if (r && (r.id || r.url)) {
      const a = document.createElement('a');
      a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = r.versionLabel || r.url;
      row.appendChild(a);
    } else {
      const m = document.createElement('span');
      m.className = 'release-missing';
      m.textContent = '未掲載';
      row.appendChild(m);
    }
    otherSec.appendChild(row);
  }

  const monetizeRow = document.createElement('div'); monetizeRow.className = 'release-row';
  const monetizeLabel = document.createElement('span');
  monetizeLabel.className = 'release-platform';
  monetizeLabel.textContent = 'ニコニコ楽曲収益化サービス';
  monetizeRow.appendChild(monetizeLabel);
  const monetizeVal = document.createElement('span');
  const monetizationStatus = detail.rightsStatus && detail.rightsStatus.niconicoMonetization;
  monetizeVal.className = 'badge ' + (monetizationStatus === 'registered' ? 'ok' : 'missing');
  monetizeVal.textContent = monetizationStatus === 'registered' ? '◯' :
    monetizationStatus === 'not_registered' ? '✕' : '未確認';
  monetizeRow.appendChild(monetizeVal);
  otherSec.appendChild(monetizeRow);

  if (detail.notes) {
    const notesRow = document.createElement('div');
    notesRow.className = 'release-row';
    const notesLabel = document.createElement('span');
    notesLabel.className = 'release-platform';
    notesLabel.textContent = '補足';
    notesRow.appendChild(notesLabel);
    const notesValue = document.createElement('span');
    notesValue.textContent = detail.notes;
    notesRow.appendChild(notesValue);
    otherSec.appendChild(notesRow);
  }
  pane.appendChild(otherSec);

  // lyrics
  const lyricsSec = document.createElement('div');
  lyricsSec.className = 'section';
  const lh = document.createElement('h2'); lh.textContent = '歌詞'; lyricsSec.appendChild(lh);

  let lyricsSource = null;
  if (p.hasLyrics) {
    lyricsSource = p;
  } else if (detail.relatedIds && detail.relatedIds.length) {
    for (const rid of detail.relatedIds) {
      const rp = POSTS_BY_ID.get(rid);
      if (rp && rp.hasLyrics) { lyricsSource = rp; break; }
    }
  }

  if (lyricsSource) {
    const box = document.createElement('div');
    box.className = 'lyrics-box';
    box.textContent = '読み込み中…';
    lyricsSec.appendChild(box);
    if (lyricsSource.id !== p.id) {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = '※「' + lyricsSource.title + '」と同じ歌詞';
      lyricsSec.appendChild(note);
    }
    pane.appendChild(lyricsSec);
    try {
      const lyrics = await loadLyrics(lyricsSource.lyricsFile);
      if (selectedId === p.id) box.textContent = lyrics;
    } catch (error) {
      if (selectedId === p.id) box.textContent = error.message;
    }
  } else {
    const n = document.createElement('div'); n.className = 'empty-note'; n.textContent = '未収録';
    lyricsSec.appendChild(n);
    pane.appendChild(lyricsSec);
  }
}

async function init() {
  const res = await fetch('works.json');
  POSTS = await res.json();
  POSTS.sort((a, b) => b.date.localeCompare(a.date));
  POSTS_BY_ID = new Map(POSTS.map(p => [p.id, p]));
  populateFilters();
  document.getElementById('filterYear').addEventListener('change', renderList);
  document.getElementById('filterText').addEventListener('input', renderList);
  renderList();
}

init();
</script>

</body>
</html>
